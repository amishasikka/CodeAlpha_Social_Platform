<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gupshup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo">Gupshup</a>
        <div class="nav-actions">
            <button id="loginNav">Login</button>
            <button id="registerNav">Register</button>
        </div>
    </header>
    <main class="auth-page">
        <div class="auth-card" id="loginCard">
            <p class="eyebrow">WELCOME BACK</p>
            <h1>Login to Gupshup</h1>
            <p class="auth-text">Connect with people and share your thoughts.</p>
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <p id="loginMessage" class="message"></p>
            <p class="switch-text">Don't have an account? <button id="showRegister">Register</button></p>
        </div>
        <div class="auth-card hidden" id="registerCard">
            <p class="eyebrow">JOIN Gupshup</p>
            <h1>Create an Account</h1>
            <p class="auth-text">Create your profile and start connecting.</p>
            <form id="registerForm">
                <input type="text" id="registerName" placeholder="Full Name" required>
                <input type="text" id="registerUsername" placeholder="Username" required>
                <input type="email" id="registerEmail" placeholder="Email" required>
                <input type="password" id="registerPassword" placeholder="Password" required>
                <button type="submit">Register</button>
            </form>
            <p id="registerMessage" class="message"></p>
            <p class="switch-text">Already have an account? <button id="showLogin">Login</button></p>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
