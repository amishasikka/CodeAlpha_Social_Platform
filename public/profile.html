<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gupshup | Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <a href="profile.html" class="logo">Gupshup</a>
        <nav>
            <a href="profile.html">Home</a>
            <a href="profile-page.html">Profile</a>
            <button id="logoutButton">Logout</button>
        </nav>
    </header>
    <main class="feed-page">
        <section class="welcome-section">
            <p class="eyebrow">YOUR FEED</p>
            <h1>What's happening?</h1>
            <p>Share your thoughts and connect with others.</p>
        </section>
        <section class="create-post">
            <h2>Create a Post</h2>
            <form id="postForm">
                <textarea id="postContent" placeholder="What's on your mind?" required></textarea>
                <button type="submit">Post</button>
            </form>
            <p id="postMessage" class="message"></p>
        </section>
        <section class="users-section">
            <div class="feed-heading">
                <h2>Discover People</h2>
            </div>
            <div id="usersContainer"></div>
        </section>
        <section class="feed">
            <div class="feed-heading">
                <h2>Recent Posts</h2>
            </div>
            <div id="postsContainer"></div>
        </section>
    </main>
    <script src="profile.js"></script>
</body>
</html>
